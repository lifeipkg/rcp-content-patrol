server:
  port: 8081

spring:
  application:
    name: content-patrol
  cloud:
    nacos:
      discovery:
        # 服务发现接线（rcp-contracts/docs/DISCOVERY.md）：占位符默认值命中部署侧
        # Service 名（compose 服务名与 K8s Service 名均为 nacos），部署侧无需注入。
        server-addr: ${NACOS_SERVER:nacos:8848}
        namespace: ${NACOS_NAMESPACE:risk-control}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

patrol:
  content:
    # 主通道阈值：正文 SimHash 汉明距离 <= 3 判重（由标注样本 PR 曲线标定）
    hamming-threshold: 3
    # 兜底通道阈值：标题编辑距离 <= 4 判重（短标题 SimHash 不稳定）
    title-edit-threshold: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
